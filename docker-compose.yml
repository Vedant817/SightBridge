services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: sightbridge, POSTGRES_PASSWORD: sightbridge, POSTGRES_DB: sightbridge}
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['6379:6379']
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ['9000:9000','9001:9001']
  api:
    image: node:22
    working_dir: /app
    command: sh -c 'corepack enable && pnpm install && pnpm --filter @sightbridge/api prisma:migrate && pnpm --filter @sightbridge/api seed && pnpm --filter @sightbridge/api dev'
    env_file: .env.example
    volumes: ['.:/app']
    ports: ['4000:4000']
    depends_on: [postgres,redis,minio]
  media-server:
    image: node:22
    working_dir: /app
    command: sh -c 'corepack enable && pnpm install && pnpm --filter @sightbridge/media-server dev'
    env_file: .env.example
    ports: ['5000:5000','40000-40100:40000-40100/udp']
    volumes: ['.:/app']
  web:
    image: node:22
    working_dir: /app
    command: sh -c 'corepack enable && pnpm install && pnpm --filter @sightbridge/web dev'
    env_file: .env.example
    ports: ['3000:3000']
    volumes: ['.:/app']
    depends_on: [api,media-server]
volumes: {pgdata: {}}
